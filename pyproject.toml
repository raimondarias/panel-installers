[project]
name = "pterodactyl-installer"
description = "Guided installation and maintenance of Pterodactyl Panel v2 and Wings on Ubuntu and Debian."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
# Runtime uses the Python standard library only.
dependencies = []

[project.optional-dependencies]
lint = ["ruff==0.8.6"]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["test-results", "dist"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors/warnings (including statement-per-line rules) and line length.
select = ["E4", "E7", "E9", "E501", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# ptero.core re-exports the historical public API on purpose.
"ptero/core.py" = ["F401"]
"installer.py" = ["F401", "F403", "F405"]
# Embedded PHP and Python programs sent to remote hosts are kept verbatim.
"ptero/nodes.py" = ["E501"]
"ptero/remote.py" = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
